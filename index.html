<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTiers - Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Golden & Black Theme Variables */
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #141414;
            --bg-hover: #1f1f1f;
            --gold-primary: #f2a900;
            --gold-gradient: linear-gradient(135deg, #f2a900 0%, #b37700 100%);
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: var(--bg-panel);
            border-bottom: 2px solid var(--border-color);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold-primary);
        }

        .search-bar {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--gold-primary);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Mode Categories */
        .categories {
            display: flex;
            gap: 15px;
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .category {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: var(--text-muted);
            min-width: 80px;
        }

        .category img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .category:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .category:hover img {
            transform: translateY(-3px);
        }

        .category.active {
            background: var(--gold-gradient);
            color: var(--bg-dark);
            font-weight: 600;
        }

        /* List Headers (Like McTiers) */
        .list-headers {
            display: flex;
            padding: 0 25px 10px 25px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .h-rank { width: 50px; }
        .h-player { flex: 1; }
        .h-region { width: 100px; text-align: left; }
        .h-tiers { width: 250px; text-align: left; }

        /* Rankings Table */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rank-row {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out;
        }

        .rank-row:hover {
            transform: translateX(10px);
            border-color: var(--gold-primary);
            background: var(--bg-hover);
            box-shadow: -5px 0 15px rgba(242, 169, 0, 0.1);
        }

        .rank-number {
            font-size: 24px;
            font-weight: 800;
            width: 50px;
            color: var(--text-muted);
        }

        /* Top 3 Stylings */
        .rank-row:nth-child(1) .rank-number { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-row:nth-child(2) .rank-number { color: #c0c0c0; }
        .rank-row:nth-child(3) .rank-number { color: #cd7f32; }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .player-avatar {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            background: #2a2a2a; 
        }

        .player-details h3 {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .player-details span {
            font-size: 12px;
            color: var(--gold-primary);
        }

        .region {
            width: 100px;
            color: #ff4d4d;
            font-weight: 800;
        }

        .player-tiers {
            width: 250px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tier-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tier-badge img {
            width: 20px;
            height: 20px;
        }

        .tier-label {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
        }

        .ht1 { background: #ffaa00; color: #000; }
        .ht2 { background: #e69900; color: #000; }
        .lt1 { background: #aa00ff; color: #fff; }
        .lt2 { background: #5555ff; color: #fff; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            background: var(--bg-panel);
            border-radius: 10px;
            border: 1px dashed var(--border-color);
        }

        /* Hidden Admin Panel */
        #admin-panel {
            display: none;
            margin-bottom: 30px;
            padding: 25px;
            background: #111;
            border: 2px dashed #f2a900;
            border-radius: 10px;
            animation: fadeIn 0.5s ease;
        }

        .admin-header {
            color: var(--gold-primary);
            margin-bottom: 15px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .admin-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .admin-box h4 { margin-bottom: 10px; color: #fff; }
        .admin-input {
            width: 100%; padding: 8px; margin-bottom: 10px;
            background: #000; color: #fff; border: 1px solid #444; border-radius: 4px;
        }
        .admin-btn {
            padding: 10px 20px; background: var(--gold-gradient); color: #000;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .admin-btn.danger {
            background: #ff4444; color: white;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" id="main-logo" onclick="handleLogoClick()">ApexTiers</div>
        <div class="nav-links">
            <a href="#" class="active">Rankings</a>
            <a href="#">Information</a>
            <a href="https://discord.gg/Stv5rzsAsk" target="_blank">Discord</a>
        </div>
        <input type="text" class="search-bar" placeholder="Search player...">
    </nav>

    <div class="container">
        <!-- Modes Header -->
        <div class="categories">
            <div class="category active" data-mode="overall">
                <span style="font-size: 24px;">🏆</span>
                <span>Overall</span>
            </div>
            <div class="category" data-mode="pot">
                <img src="pot.webp" alt="Pot">
                <span>Pot</span>
            </div>
            <div class="category" data-mode="cpvp">
                <img src="cpvp.webp" alt="CPVP">
                <span>CPVP</span>
            </div>
            <div class="category" data-mode="smp">
                <img src="smp.webp" alt="SMP">
                <span>SMP</span>
            </div>
            <div class="category" data-mode="sword">
                <img src="sword.webp" alt="Sword">
                <span>Sword</span>
            </div>
            <div class="category" data-mode="axe">
                <img src="axe.webp" alt="Axe">
                <span>Axe</span>
            </div>
            <div class="category" data-mode="mace">
                <img src="mace.webp" alt="Mace">
                <span>Mace</span>
            </div>
            <div class="category" data-mode="uhc">
                <img src="uhc.webp" alt="UHC">
                <span>UHC</span>
            </div>
            <div class="category" data-mode="spearmace">
                <img src="spearmace.webp" alt="SpearMace">
                <span>SpearMace</span>
            </div>
        </div>

        <!-- Hidden Tester Admin -->
        <div id="admin-panel">
            <h2 class="admin-header">⚙️ Tester Admin Controls (Secured)</h2>
            <div class="admin-grid">
                <!-- Add Player Form -->
                <div class="admin-box">
                    <h4>Add / Update Player</h4>
                    <select id="add-mode" class="admin-input">
                        <option value="overall">Overall</option>
                        <option value="pot">Pot</option>
                        <option value="cpvp">CPVP</option>
                        <option value="smp">SMP</option>
                        <option value="sword">Sword</option>
                        <option value="axe">Axe</option>
                        <option value="mace">Mace</option>
                        <option value="uhc">UHC</option>
                        <option value="spearmace">SpearMace</option>
                    </select>
                    <input type="text" id="add-name" class="admin-input" placeholder="Player Name (e.g. Marlowww)">
                    <input type="text" id="add-uuid" class="admin-input" placeholder="Minecraft UUID (For Avatar)">
                    <input type="text" id="add-title" class="admin-input" placeholder="Title (e.g. Combat Grandmaster)">
                    <input type="number" id="add-score" class="admin-input" placeholder="Total Score/Points (For Sorting)">
                    <input type="text" id="add-region" class="admin-input" placeholder="Region (e.g. NA, EU)">
                    <input type="text" id="add-tiers" class="admin-input" placeholder="Tiers (e.g. pot:ht1, sword:lt2)">
                    <button class="admin-btn" onclick="addPlayer()">Add Player to Leaderboard</button>
                </div>
                
                <!-- Remove Player Form -->
                <div class="admin-box">
                    <h4>Remove Player</h4>
                    <select id="remove-mode" class="admin-input">
                        <option value="overall">Overall</option>
                        <option value="pot">Pot</option>
                        <option value="cpvp">CPVP</option>
                        <option value="smp">SMP</option>
                        <option value="sword">Sword</option>
                        <option value="axe">Axe</option>
                        <option value="mace">Mace</option>
                        <option value="uhc">UHC</option>
                        <option value="spearmace">SpearMace</option>
                    </select>
                    <input type="text" id="remove-name" class="admin-input" placeholder="Exact Player Name to Remove">
                    <button class="admin-btn danger" onclick="removePlayer()">Remove Player</button>
                    
                    <br><br><br>
                    <button class="admin-btn" style="background:#444; color:white;" onclick="alert('Discord bot sync endpoint not yet configured.')">Sync Discord Bot</button>
                </div>
            </div>
        </div>

        <!-- Table Headers -->
        <div class="list-headers">
            <div class="h-rank">#</div>
            <div class="h-player">PLAYER</div>
            <div class="h-region">REGION</div>
            <div class="h-tiers">TIERS</div>
        </div>

        <!-- Dynamic Rankings Table -->
        <div class="ranking-list" id="ranking-container">
            <!-- JavaScript will populate this based on the selected mode -->
        </div>
    </div>

    <script>
        // Initialize Player Database in LocalStorage (Starts completely empty)
        let db = JSON.parse(localStorage.getItem('apexTiersDB'));
        if (!db) {
            db = {
                overall: [], pot: [], cpvp: [], smp: [], sword: [], 
                axe: [], mace: [], uhc: [], spearmace: []
            };
            localStorage.setItem('apexTiersDB', JSON.stringify(db));
        }

        let currentMode = 'overall';

        // Render Leaderboard Function
        function renderLeaderboard(mode) {
            const container = document.getElementById('ranking-container');
            container.innerHTML = ''; // Clear current

            const players = db[mode] || [];

            // Sort players by score highest to lowest
            players.sort((a, b) => b.score - a.score);

            if (players.length === 0) {
                container.innerHTML = `<div class="empty-state">No players found in this category yet. Use Admin Panel to add players.</div>`;
                return;
            }

            players.forEach((player, index) => {
                // Parse the tiers string (e.g. "pot:ht1, sword:lt2")
                let tiersHTML = '';
                if (player.tiers) {
                    const tierList = player.tiers.split(',');
                    tierList.forEach(t => {
                        const parts = t.trim().split(':');
                        if(parts.length === 2) {
                            const icon = parts[0].toLowerCase();
                            const rank = parts[1].toLowerCase();
                            tiersHTML += `
                                <div class="tier-badge">
                                    <img src="${icon}.webp" alt="${icon}" onerror="this.src='pot.webp'">
                                    <span class="tier-label ${rank}">${rank.toUpperCase()}</span>
                                </div>
                            `;
                        }
                    });
                }

                // Default Avatar if UUID is missing
                const avatarUrl = player.uuid ? `https://crafatar.com/avatars/${player.uuid}?overlay` : `https://crafatar.com/avatars/8667ba71-b85a-4004-af54-457a9734eed7?overlay`;

                const row = `
                    <div class="rank-row">
                        <div class="rank-number">${index + 1}.</div>
                        <div class="player-info">
                            <img src="${avatarUrl}" alt="${player.name}" class="player-avatar">
                            <div class="player-details">
                                <h3>${player.name}</h3>
                                <span>❖ ${player.title} (${player.score} points)</span>
                            </div>
                        </div>
                        <div class="region">${player.region.toUpperCase()}</div>
                        <div class="player-tiers">
                            ${tiersHTML}
                        </div>
                    </div>
                `;
                container.innerHTML += row;
            });
        }

        // Category Selection Logic
        const categories = document.querySelectorAll('.category');
        categories.forEach(category => {
            category.addEventListener('click', () => {
                categories.forEach(c => c.classList.remove('active'));
                category.classList.add('active');
                
                currentMode = category.getAttribute('data-mode');
                renderLeaderboard(currentMode);
            });
        });

        // Initial Render
        renderLeaderboard('overall');

        // Secret Admin Logic (Triple click the logo)
        let clickCount = 0;
        let clickTimer;
        function handleLogoClick() {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1500); 
            }
            if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                const password = prompt("Restricted Access. Enter Admin Password:");
                if (password === "hitler?988") {
                    document.getElementById('admin-panel').style.display = 'block';
                    document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
                } else if (password !== null) {
                    alert("Authentication Failed.");
                }
            }
        }

        // Admin Function: Add Player
        function addPlayer() {
            const mode = document.getElementById('add-mode').value;
            const name = document.getElementById('add-name').value;
            const uuid = document.getElementById('add-uuid').value;
            const title = document.getElementById('add-title').value;
            const score = parseInt(document.getElementById('add-score').value) || 0;
            const region = document.getElementById('add-region').value;
            const tiers = document.getElementById('add-tiers').value;

            if (!name) return alert("Player name is required!");

            // Check if player exists in this mode, remove them to update
            db[mode] = db[mode].filter(p => p.name.toLowerCase() !== name.toLowerCase());

            db[mode].push({ name, uuid, title, score, region, tiers });
            localStorage.setItem('apexTiersDB', JSON.stringify(db));
            
            alert(`Added/Updated ${name} in ${mode.toUpperCase()} leaderboard!`);
            
            // Clear inputs
            document.getElementById('add-name').value = '';
            document.getElementById('add-score').value = '';
            
            // Re-render if we are currently looking at that mode
            if (currentMode === mode) renderLeaderboard(mode);
        }

        // Admin Function: Remove Player
        function removePlayer() {
            const mode = document.getElementById('remove-mode').value;
            const name = document.getElementById('remove-name').value;

            if (!name) return alert("Player name is required!");

            const initialLength = db[mode].length;
            db[mode] = db[mode].filter(p => p.name.toLowerCase() !== name.toLowerCase());

            if (db[mode].length === initialLength) {
                alert(`Player ${name} not found in ${mode.toUpperCase()} leaderboard.`);
            } else {
                localStorage.setItem('apexTiersDB', JSON.stringify(db));
                alert(`Removed ${name} from ${mode.toUpperCase()} leaderboard.`);
                document.getElementById('remove-name').value = '';
                if (currentMode === mode) renderLeaderboard(mode);
            }
        }
    </script>
</body>
</html>

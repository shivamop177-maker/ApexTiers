<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTiers - Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #141414;
            --bg-hover: #1f1f1f;
            --gold-primary: #f2a900;
            --gold-gradient: linear-gradient(135deg, #f2a900 0%, #b37700 100%);
            --text-main: #ffffff;
            --text-muted: #8b8b99;
            --border-color: #222228;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        @keyframes goldGlow {
            0% { box-shadow: 0 0 10px rgba(242, 169, 0, 0.2); }
            50% { box-shadow: 0 0 25px rgba(242, 169, 0, 0.6); }
            100% { box-shadow: 0 0 10px rgba(242, 169, 0, 0.2); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            letter-spacing: 1px;
        }

        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--gold-primary); }

        .search-container {
            position: relative;
            background: #0d0d0f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 250px;
        }
        .search-container i { color: var(--text-muted); font-size: 13px; }
        .search-bar { background: transparent; border: none; color: white; outline: none; font-size: 13px; width: 100%; }

        /* Container */
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; animation: fadeIn 0.5s ease-out; }

        /* Top Bar: Modes + Server Widget */
        .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; flex-wrap: wrap; }
        .categories {
            display: flex; gap: 10px; background: var(--bg-panel); padding: 10px 15px;
            border-radius: 12px; overflow-x: auto; border: 1px solid var(--border-color); flex: 1;
        }
        .category {
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
            padding: 8px 14px; border-radius: 8px; transition: all 0.3s ease; color: var(--text-muted);
            min-width: 70px; font-size: 12px; font-weight: 600;
        }
        .category img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); transition: transform 0.3s ease; }
        .category:hover { background: var(--bg-hover); color: var(--text-main); }
        .category:hover img { transform: translateY(-2px); }
        .category.active { background: var(--gold-gradient); color: var(--bg-dark); font-weight: 700; }

        /* Server IP Widget */
        .server-widget { display: flex; align-items: center; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 15px; gap: 15px; }
        .server-ip-box { display: flex; align-items: center; background: #0d0d0f; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 12px; gap: 10px; cursor: pointer; }
        .server-icon-badge { background: #cc2222; color: white; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .server-ip-text { font-size: 13px; font-weight: 700; color: #fff; }

        /* Admin Panel Section */
        .admin-panel {
            margin-bottom: 30px; padding: 25px; background: #121216;
            border: 2px solid var(--gold-primary); border-radius: 12px;
            box-shadow: 0 4px 20px rgba(242, 169, 0, 0.15);
        }
        .admin-header { color: var(--gold-primary); margin-bottom: 15px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .admin-box { background: #18181c; padding: 18px; border-radius: 8px; border: 1px solid var(--border-color); }
        .admin-box h4 { margin-bottom: 12px; color: #fff; font-size: 14px; }
        .admin-input {
            width: 100%; padding: 10px 12px; margin-bottom: 10px;
            background: #0a0a0c; color: #fff; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none;
        }
        .admin-input:focus { border-color: var(--gold-primary); }

        .tier-inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .tier-input-row { display: flex; align-items: center; gap: 8px; background: #0a0a0c; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border-color); }
        .tier-input-row img { width: 18px; height: 18px; }
        .tier-input-row select { background: transparent; color: white; border: none; outline: none; width: 100%; font-size: 12px; }

        .admin-btn {
            padding: 10px; background: var(--gold-gradient); color: #000;
            border: none; border-radius: 6px; cursor: pointer; font-weight: 700; width: 100%; font-size: 13px; transition: opacity 0.2s;
        }
        .admin-btn:hover { opacity: 0.9; }
        .admin-btn.danger { background: #ff4444; color: white; }

        /* Table Headers */
        .list-headers { display: flex; padding: 0 25px 8px 25px; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .h-rank { width: 60px; }
        .h-player { flex: 1; }
        .h-region { width: 90px; }
        .h-tiers { width: 320px; }

        /* Rankings Rows */
        .ranking-list { display: flex; flex-direction: column; gap: 10px; }
        .rank-row { display: flex; align-items: center; background: var(--bg-panel); padding: 14px 25px; border-radius: 10px; border: 1px solid var(--border-color); transition: all 0.25s ease; }
        .rank-row:hover { transform: translateX(6px); border-color: var(--gold-primary); background: var(--bg-hover); }

        /* Top 3 Glowing & Slanted Styles */
        .rank-row.rank-1 { background: linear-gradient(90deg, rgba(242, 169, 0, 0.25) 0%, var(--bg-panel) 40%); border-color: rgba(242, 169, 0, 0.5); animation: goldGlow 3s infinite; }
        .rank-row.rank-1 .rank-number { color: #ffd700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }

        .rank-row.rank-2 { background: linear-gradient(90deg, rgba(148, 163, 184, 0.18) 0%, var(--bg-panel) 40%); border-color: rgba(148, 163, 184, 0.4); }
        .rank-row.rank-2 .rank-number { color: #e2e8f0; }

        .rank-row.rank-3 { background: linear-gradient(90deg, rgba(205, 127, 50, 0.18) 0%, var(--bg-panel) 40%); border-color: rgba(205, 127, 50, 0.4); }
        .rank-row.rank-3 .rank-number { color: #f97316; }

        .rank-number { font-size: 22px; font-weight: 800; width: 60px; color: var(--text-muted); font-style: italic; }
        .player-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .player-avatar { width: 42px; height: 42px; border-radius: 6px; background: #1f1f26; border: 1px solid var(--border-color); }
        .player-details h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
        .player-details span { font-size: 11px; color: var(--gold-primary); font-weight: 600; }
        .region { width: 90px; color: #ff4d4d; font-weight: 800; font-size: 13px; }

        .player-tiers { width: 320px; display: flex; gap: 10px; flex-wrap: wrap; }
        .tier-badge { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .tier-badge img { width: 18px; height: 18px; object-fit: contain; }
        .tier-label { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 800; }

        .ht1 { background: #ffaa00; color: #000; }
        .lt1 { background: #aa00ff; color: #fff; }
        .ht2 { background: #e69900; color: #000; }
        .lt2 { background: #5555ff; color: #fff; }
        .ht3 { background: #cc8800; color: #fff; }
        .lt3 { background: #4444dd; color: #fff; }
        .ht4 { background: #b37700; color: #fff; }
        .lt4 { background: #3333bb; color: #fff; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav>
        <div class="logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">APEXTIERS</div>
        <div class="nav-links">
            <a id="nav-home" class="active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> Home</a>
            <a id="nav-rankings" onclick="switchTab('rankings')"><i class="fa-solid fa-trophy"></i> Rankings</a>
            <a href="https://discord.gg/Stv5rzsAsk" target="_blank"><i class="fa-brands fa-discord"></i> Discords</a>
            <a href="#"><i class="fa-solid fa-file-code"></i> API Docs</a>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="search-bar" class="search-bar" placeholder="Search player..." oninput="renderApp()">
        </div>
    </nav>

    <div class="container">
        <!-- Modes & Server IP Header Bar -->
        <div class="top-action-bar" id="main-content-bar">
            <div class="categories" id="categories-container">
                <div class="category active" data-mode="overall">
                    <span style="font-size: 20px;">🏆</span>
                    <span>Overall</span>
                </div>
                <div class="category" data-mode="pot">
                    <img src="pot.webp" alt="Pot" onerror="this.src='pot.webp'">
                    <span>Pot</span>
                </div>
                <div class="category" data-mode="cpvp">
                    <img src="cpvp.webp" alt="CPVP" onerror="this.src='pot.webp'">
                    <span>CPVP</span>
                </div>
                <div class="category" data-mode="smp">
                    <img src="smp.webp" alt="SMP" onerror="this.src='pot.webp'">
                    <span>SMP</span>
                </div>
                <div class="category" data-mode="sword">
                    <img src="sword.webp" alt="Sword" onerror="this.src='pot.webp'">
                    <span>Sword</span>
                </div>
                <div class="category" data-mode="axe">
                    <img src="axe.webp" alt="Axe" onerror="this.src='pot.webp'">
                    <span>Axe</span>
                </div>
                <div class="category" data-mode="mace">
                    <img src="mace.webp" alt="Mace" onerror="this.src='pot.webp'">
                    <span>Mace</span>
                </div>
                <div class="category" data-mode="uhc">
                    <img src="uhc.webp" alt="UHC" onerror="this.src='pot.webp'">
                    <span>UHC</span>
                </div>
                <div class="category" data-mode="spearmace">
                    <img src="spearmace.webp" alt="SpearMace" onerror="this.src='pot.webp'">
                    <span>SpearMace</span>
                </div>
            </div>

            <!-- Server IP Widget -->
            <div class="server-widget">
                <div class="server-ip-box" onclick="copyIP()" title="Click to copy IP">
                    <span class="server-icon-badge">CLUB</span>
                    <span class="server-ip-text" id="display-server-ip">play.apextiers.fun</span>
                    <i class="fa-brands fa-discord" style="color: #5865F2;"></i>
                </div>
            </div>
        </div>

        <!-- Fully Visible Admin Panel -->
        <div class="admin-panel" id="admin-panel-section">
            <h2 class="admin-header"><i class="fa-solid fa-gear"></i> Server & Player Management</h2>
            <div class="admin-grid">
                <div class="admin-box">
                    <h4>Add / Update Player</h4>
                    <input type="text" id="admin-name" class="admin-input" placeholder="Player Name (e.g. Marlowww)">
                    <input type="text" id="admin-uuid" class="admin-input" placeholder="Minecraft UUID (for skin head)">
                    <select id="admin-region" class="admin-input">
                        <option value="NA">NA</option>
                        <option value="EU">EU</option>
                        <option value="AS">AS</option>
                        <option value="AU">AU</option>
                        <option value="ME">ME</option>
                    </select>
                    <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">Assign Tiers (Points calculate automatically):</p>
                    <div class="tier-inputs-grid" id="admin-tier-inputs"></div>
                    <button class="admin-btn" onclick="saveAdminPlayer()">Save / Update Player</button>
                </div>
                <div class="admin-box">
                    <h4>Server Configuration & Removal</h4>
                    <input type="text" id="admin-server-ip-input" class="admin-input" placeholder="Change Server IP (e.g. mcpvp.club)">
                    <button class="admin-btn" style="margin-bottom: 20px;" onclick="updateServerIP()">Update Server IP</button>
                    
                    <h4 style="margin-top: 15px;">Remove Player</h4>
                    <input type="text" id="admin-remove-name" class="admin-input" placeholder="Exact Name to Remove">
                    <button class="admin-btn danger" onclick="removeAdminPlayer()">Remove Player</button>
                </div>
            </div>
        </div>

        <!-- Table Headers -->
        <div class="list-headers">
            <div class="h-rank">#</div>
            <div class="h-player">PLAYER</div>
            <div class="h-region">REGION</div>
            <div class="h-tiers">TIERS</div>
        </div>

        <!-- Rankings Table List -->
        <div class="ranking-list" id="ranking-container"></div>
    </div>

    <script>
        const GAMEMODES = ['pot', 'cpvp', 'smp', 'sword', 'axe', 'mace', 'uhc', 'spearmace'];
        const TIER_SCORES = {
            'HT1': 30, 'LT1': 27, 'HT2': 24, 'LT2': 21,
            'HT3': 18, 'LT3': 15, 'HT4': 12, 'LT4': 9, 'None': 0
        };

        const defaultPlayers = [
            { name: "Marlowww", uuid: "61699b2e-d327-4a01-9f1e-0ea8c3f06bc6", region: "NA", tiers: { pot: "HT1", sword: "HT1", cpvp: "HT1", axe: "HT1", smp: "HT1", mace: "HT1", uhc: "LT1", spearmace: "LT1" } },
            { name: "ItzRealMe", uuid: "8667ba71-b85a-4004-af54-457a9734eed7", region: "NA", tiers: { sword: "HT3", pot: "HT1", cpvp: "HT1", smp: "HT1", uhc: "LT2", mace: "LT2" } },
            { name: "coldified", uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5", region: "EU", tiers: { pot: "LT1", sword: "LT3", cpvp: "HT1", smp: "HT1", uhc: "LT1", axe: "HT1", mace: "LT2" } },
            { name: "Swight", uuid: "1a82d658-7512-4217-9104-1bbf6e5f1d46", region: "NA", tiers: { pot: "LT3", sword: "HT1", cpvp: "HT1", smp: "HT1", uhc: "HT2", mace: "LT2", spearmace: "LT2" } },
            { name: "janekv", uuid: "c0695026-0e9f-44e9-92b0-9c2f42a0b1bc", region: "EU", tiers: { pot: "LT3", sword: "HT4", cpvp: "HT1", smp: "HT1", uhc: "HT1", axe: "HT2", mace: "LT2", spearmace: "LT2" } }
        ];

        let playersDB = JSON.parse(localStorage.getItem('apexTiersDB')) || defaultPlayers;
        let serverIP = localStorage.getItem('apexServerIP') || 'play.apextiers.fun';
        let currentMode = 'overall';

        document.getElementById('display-server-ip').innerText = serverIP;
        document.getElementById('admin-server-ip-input').value = serverIP;

        function setupAdminInputs() {
            const container = document.getElementById('admin-tier-inputs');
            let html = '';
            GAMEMODES.forEach(gm => {
                html += `
                    <div class="tier-input-row">
                        <img src="${gm}.webp" alt="${gm}" onerror="this.src='pot.webp'">
                        <select id="admin-gm-${gm}">
                            <option value="None">None</option>
                            ${Object.keys(TIER_SCORES).filter(t => t !== 'None').map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        setupAdminInputs();

        function calculatePoints(tiers) {
            let total = 0;
            for (let gm in tiers) {
                total += TIER_SCORES[tiers[gm]] || 0;
            }
            return total;
        }

        function getTitle(points) {
            if (points >= 200) return "Combat Grandmaster";
            if (points >= 120) return "Combat Master";
            if (points >= 60) return "Combat Veteran";
            return "Fighter";
        }

        function renderApp() {
            const container = document.getElementById('ranking-container');
            const searchVal = document.getElementById('search-bar').value.toLowerCase();
            container.innerHTML = '';

            let list = [...playersDB];

            if (searchVal) {
                list = list.filter(p => p.name.toLowerCase().includes(searchVal));
            }

            if (currentMode !== 'overall') {
                list = list.filter(p => p.tiers && p.tiers[currentMode] && p.tiers[currentMode] !== 'None');
                list.sort((a, b) => {
                    let scoreA = TIER_SCORES[a.tiers[currentMode]] || 0;
                    let scoreB = TIER_SCORES[b.tiers[currentMode]] || 0;
                    if (scoreA === scoreB) return calculatePoints(b.tiers) - calculatePoints(a.tiers);
                    return scoreB - scoreA;
                });
            } else {
                list.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            }

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">No records found in this category.</div>`;
                return;
            }

            list.forEach((player, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const points = calculatePoints(player.tiers);
                const title = getTitle(points);

                let tiersHTML = '';
                if (player.tiers) {
                    for (let gm in player.tiers) {
                        let t = player.tiers[gm];
                        if (t && t !== 'None') {
                            tiersHTML += `
                                <div class="tier-badge">
                                    <img src="${gm}.webp" alt="${gm}" onerror="this.src='pot.webp'">
                                    <span class="tier-label ${t.toLowerCase()}">${t}</span>
                                </div>
                            `;
                        }
                    }
                }

                const avatar = player.uuid ? `https://crafatar.com/avatars/${player.uuid}?overlay` : `https://crafatar.com/avatars/8667ba71-b85a-4004-af54-457a9734eed7?overlay`;

                container.innerHTML += `
                    <div class="rank-row ${rankClass}">
                        <div class="rank-number">${rank}.</div>
                        <div class="player-info">
                            <img src="${avatar}" alt="${player.name}" class="player-avatar">
                            <div class="player-details">
                                <h3>${player.name}</h3>
                                <span>❖ ${title} (${points} points)</span>
                            </div>
                        </div>
                        <div class="region">${player.region}</div>
                        <div class="player-tiers">${tiersHTML}</div>
                    </div>
                `;
            });
        }

        // Mode Switching
        document.querySelectorAll('.category').forEach(cat => {
            cat.addEventListener('click', () => {
                document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                cat.classList.add('active');
                currentMode = cat.getAttribute('data-mode');
                renderApp();
            });
        });

        // Tab Navigation Logic (Home vs Rankings)
        function switchTab(tab) {
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-rankings').classList.remove('active');

            if (tab === 'home') {
                document.getElementById('nav-home').classList.add('active');
                document.getElementById('admin-panel-section').style.display = 'block';
                document.getElementById('main-content-bar').style.display = 'flex';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (tab === 'rankings') {
                document.getElementById('nav-rankings').classList.add('active');
                document.getElementById('admin-panel-section').style.display = 'none';
                document.getElementById('main-content-bar').style.display = 'flex';
                document.getElementById('ranking-container').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Save / Update Player to LocalStorage
        function saveAdminPlayer() {
            const name = document.getElementById('admin-name').value.trim();
            const uuid = document.getElementById('admin-uuid').value.trim();
            const region = document.getElementById('admin-region').value;

            if (!name) return alert("Player Name is required.");

            let tiersObj = {};
            GAMEMODES.forEach(gm => {
                let val = document.getElementById(`admin-gm-${gm}`).value;
                if (val !== 'None') tiersObj[gm] = val;
            });

            // Remove existing if updating
            playersDB = playersDB.filter(p => p.name.toLowerCase() !== name.toLowerCase());
            playersDB.push({ name, uuid, region, tiers: tiersObj });

            localStorage.setItem('apexTiersDB', JSON.stringify(playersDB));
            alert(`Successfully saved ${name}!`);

            document.getElementById('admin-name').value = '';
            document.getElementById('admin-uuid').value = '';
            renderApp();
        }

        // Remove Player from LocalStorage
        function removeAdminPlayer() {
            const name = document.getElementById('admin-remove-name').value.trim();
            if (!name) return alert("Enter name to remove.");

            let len = playersDB.length;
            playersDB = playersDB.filter(p => p.name.toLowerCase() !== name.toLowerCase());
            
            if (playersDB.length === len) {
                alert("Player not found.");
            } else {
                localStorage.setItem('apexTiersDB', JSON.stringify(playersDB));
                alert(`Removed ${name}`);
                document.getElementById('admin-remove-name').value = '';
                renderApp();
            }
        }

        // Update Server IP
        function updateServerIP() {
            const newIp = document.getElementById('admin-server-ip-input').value.trim();
            if (!newIp) return;
            serverIP = newIp;
            localStorage.setItem('apexServerIP', serverIP);
            document.getElementById('display-server-ip').innerText = serverIP;
            alert("Server IP updated successfully!");
        }

        function copyIP() {
            navigator.clipboard.writeText(serverIP);
            alert(`Copied server IP: ${serverIP}`);
        }

        renderApp();
    </script>
</body>
</html>

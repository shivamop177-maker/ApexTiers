<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTiers - Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Golden & Black Theme Variables */
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #141414;
            --bg-hover: #1f1f1f;
            --gold-primary: #f2a900;
            --gold-gradient: linear-gradient(135deg, #f2a900 0%, #b37700 100%);
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: var(--bg-panel);
            border-bottom: 2px solid var(--border-color);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold-primary);
        }

        .search-bar {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--gold-primary);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Mode Categories */
        .categories {
            display: flex;
            gap: 15px;
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .category {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: var(--text-muted);
            min-width: 80px;
        }

        .category img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .category:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .category:hover img {
            transform: translateY(-3px);
        }

        .category.active {
            background: var(--gold-gradient);
            color: var(--bg-dark);
            font-weight: 600;
        }

        /* Rankings Table */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rank-row {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        .rank-row:hover {
            transform: translateX(10px);
            border-color: var(--gold-primary);
            background: var(--bg-hover);
            box-shadow: -5px 0 15px rgba(242, 169, 0, 0.1);
        }

        .rank-number {
            font-size: 24px;
            font-weight: 800;
            width: 50px;
            color: var(--text-muted);
        }

        /* Top 3 Stylings */
        .rank-row:nth-child(1) .rank-number { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-row:nth-child(2) .rank-number { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.3); }
        .rank-row:nth-child(3) .rank-number { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.3); }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .player-avatar {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            background: #2a2a2a; 
        }

        .player-details h3 {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .player-details span {
            font-size: 12px;
            color: var(--gold-primary);
        }

        .region {
            width: 80px;
            color: #ff4d4d;
            font-weight: 800;
            text-align: center;
            margin-right: 20px;
        }

        .player-tiers {
            display: flex;
            gap: 12px;
            width: 300px;
            flex-wrap: wrap;
        }

        .tier-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tier-badge img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .tier-label {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .ht1 { background: #ffaa00; color: #000; }
        .lt1 { background: #aa00ff; color: #fff; }
        .ht2 { background: #e69900; color: #000; }
        .lt2 { background: #5555ff; color: #fff; }
        .ht3 { background: #cc8800; color: #fff; }
        .lt3 { background: #4444dd; color: #fff; }
        .ht4 { background: #b37700; color: #fff; }
        .lt4 { background: #3333bb; color: #fff; }
        .ht5 { background: #996600; color: #fff; }
        .lt5 { background: #222299; color: #fff; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            background: var(--bg-panel);
            border-radius: 10px;
            border: 1px dashed var(--border-color);
        }

        /* Hidden Admin Panel */
        #admin-panel {
            display: none;
            margin-bottom: 30px;
            padding: 25px;
            background: #111;
            border: 2px dashed var(--gold-primary);
            border-radius: 10px;
            animation: fadeIn 0.5s ease;
        }

        .admin-header {
            color: var(--gold-primary);
            margin-bottom: 15px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .admin-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .admin-box h4 { margin-bottom: 15px; color: #fff; }
        .admin-input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            background: #000; color: #fff; border: 1px solid #444; border-radius: 4px;
        }
        
        .tier-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tier-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #000;
            padding: 5px 10px;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .tier-input-group img {
            width: 20px; height: 20px;
        }

        .tier-input-group select {
            background: transparent;
            color: white;
            border: none;
            outline: none;
            width: 100%;
        }

        .admin-btn {
            padding: 12px 20px; background: var(--gold-gradient); color: #000;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;
            transition: opacity 0.2s;
        }
        .admin-btn:hover { opacity: 0.9; }
        .admin-btn.danger { background: #ff4444; color: white; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" id="main-logo" onclick="handleLogoClick()">ApexTiers</div>
        <div class="nav-links">
            <a href="#" class="active">Rankings</a>
            <a href="#">Information</a>
            <a href="https://discord.gg/Stv5rzsAsk" target="_blank">Discord</a>
        </div>
        <input type="text" class="search-bar" id="search-input" placeholder="Search player..." oninput="renderLeaderboard()">
    </nav>

    <div class="container">
        <!-- Modes Header -->
        <div class="categories">
            <div class="category active" data-mode="overall">
                <span style="font-size: 24px;">🏆</span>
                <span>Overall</span>
            </div>
            <div class="category" data-mode="pot">
                <img src="pot.webp" alt="Pot">
                <span>Pot</span>
            </div>
            <div class="category" data-mode="cpvp">
                <img src="cpvp.webp" alt="CPVP">
                <span>CPVP</span>
            </div>
            <div class="category" data-mode="smp">
                <img src="smp.webp" alt="SMP">
                <span>SMP</span>
            </div>
            <div class="category" data-mode="sword">
                <img src="sword.webp" alt="Sword">
                <span>Sword</span>
            </div>
            <div class="category" data-mode="axe">
                <img src="axe.webp" alt="Axe">
                <span>Axe</span>
            </div>
            <div class="category" data-mode="mace">
                <img src="mace.webp" alt="Mace">
                <span>Mace</span>
            </div>
            <div class="category" data-mode="uhc">
                <img src="uhc.webp" alt="UHC">
                <span>UHC</span>
            </div>
            <div class="category" data-mode="spearmace">
                <img src="spearmace.webp" alt="SpearMace">
                <span>SpearMace</span>
            </div>
        </div>

        <!-- Hidden Tester Admin -->
        <div id="admin-panel">
            <h2 class="admin-header">⚙️ Tester Admin Controls (Secured)</h2>
            <div class="admin-grid">
                <!-- Add Player Form -->
                <div class="admin-box">
                    <h4>Add / Update Player</h4>
                    <input type="text" id="add-name" class="admin-input" placeholder="Player Name (e.g. Marlowww)">
                    <input type="text" id="add-uuid" class="admin-input" placeholder="Minecraft UUID (Optional, for avatar)">
                    <select id="add-region" class="admin-input">
                        <option value="NA">NA</option>
                        <option value="EU">EU</option>
                        <option value="AS">AS</option>
                        <option value="AU">AU</option>
                        <option value="ME">ME</option>
                    </select>
                    
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Set Tiers (Points calculate automatically)</p>
                    <div class="tier-grid" id="admin-tiers-grid">
                        <!-- Populated by JS -->
                    </div>

                    <button class="admin-btn" onclick="addPlayer()">Save Player Record</button>
                </div>
                
                <!-- Remove Player Form -->
                <div class="admin-box">
                    <h4>Remove Player</h4>
                    <input type="text" id="remove-name" class="admin-input" placeholder="Exact Player Name to Remove">
                    <button class="admin-btn danger" onclick="removePlayer()">Remove Player</button>
                    
                    <br><br><br>
                    <button class="admin-btn" style="background:#444; color:white;" onclick="alert('Discord bot sync endpoint not yet configured.')">Sync Discord Bot</button>
                </div>
            </div>
        </div>

        <!-- Dynamic Rankings Table -->
        <div class="ranking-list" id="ranking-container">
            <!-- JavaScript will populate this based on the selected mode -->
        </div>
    </div>

    <script>
        // System Constants
        const ADMIN_PASS = "hitler?988";
        const GAMEMODES = ['pot', 'cpvp', 'smp', 'sword', 'axe', 'mace', 'uhc', 'spearmace'];
        const TIER_SCORES = {
            'HT1': 30, 'LT1': 27,
            'HT2': 24, 'LT2': 21,
            'HT3': 18, 'LT3': 15,
            'HT4': 12, 'LT4': 9,
            'HT5': 6,  'LT5': 3,
            'None': 0
        };
        const ALL_TIERS = Object.keys(TIER_SCORES);

        // State
        let currentMode = 'overall';
        let db = JSON.parse(localStorage.getItem('apexTiersDB')) || [];

        // Utility: Calculate total points for a player
        function calculatePoints(tiersObj) {
            let total = 0;
            for (let gm in tiersObj) {
                if (TIER_SCORES[tiersObj[gm]]) {
                    total += TIER_SCORES[tiersObj[gm]];
                }
            }
            return total;
        }

        // Utility: Generate a cool title based on points
        function getTitle(points) {
            if (points >= 150) return "Combat Grandmaster";
            if (points >= 100) return "Combat Master";
            if (points >= 60) return "Combat Veteran";
            if (points >= 30) return "Combatant";
            if (points > 0) return "Fighter";
            return "Unranked";
        }

        // Render Admin Tier Selectors
        function setupAdminTiers() {
            const grid = document.getElementById('admin-tiers-grid');
            let html = '';
            GAMEMODES.forEach(gm => {
                html += `
                    <div class="tier-input-group">
                        <img src="${gm}.webp" alt="${gm}" onerror="this.src='pot.webp'">
                        <select id="tier-${gm}">
                            ${ALL_TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }
        setupAdminTiers();

        // Render Leaderboard
        function renderLeaderboard() {
            const container = document.getElementById('ranking-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = ''; 

            let filteredPlayers = [...db];

            // 1. Filter by Search Query
            if (searchQuery) {
                filteredPlayers = filteredPlayers.filter(p => p.name.toLowerCase().includes(searchQuery));
            }

            // 2. Filter & Sort by Gamemode
            if (currentMode !== 'overall') {
                // Keep only players who have a rank in this specific gamemode
                filteredPlayers = filteredPlayers.filter(p => p.tiers && p.tiers[currentMode] && p.tiers[currentMode] !== 'None');
                
                // Sort by the specific gamemode's tier score (e.g. HT1 > LT2)
                filteredPlayers.sort((a, b) => {
                    let scoreA = TIER_SCORES[a.tiers[currentMode]] || 0;
                    let scoreB = TIER_SCORES[b.tiers[currentMode]] || 0;
                    // If tied in this gamemode, use total points as tiebreaker
                    if (scoreA === scoreB) return calculatePoints(b.tiers) - calculatePoints(a.tiers);
                    return scoreB - scoreA;
                });
            } else {
                // Sort by total overall points
                filteredPlayers.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            }

            if (filteredPlayers.length === 0) {
                container.innerHTML = `<div class="empty-state">No players found. Use the Admin Panel to add players.</div>`;
                return;
            }

            // 3. Generate HTML
            filteredPlayers.forEach((player, index) => {
                let tiersHTML = '';
                let totalPoints = calculatePoints(player.tiers);
                let title = getTitle(totalPoints);

                // Build the tier badges
                if (player.tiers) {
                    for (let gm in player.tiers) {
                        let rank = player.tiers[gm];
                        if (rank !== 'None') {
                            tiersHTML += `
                                <div class="tier-badge">
                                    <img src="${gm}.webp" alt="${gm}" onerror="this.src='pot.webp'">
                                    <span class="tier-label ${rank.toLowerCase()}">${rank}</span>
                                </div>
                            `;
                        }
                    }
                }

                // Avatar fallback
                const avatarUrl = player.uuid && player.uuid.trim() !== '' 
                    ? `https://crafatar.com/avatars/${player.uuid}?overlay` 
                    : `https://crafatar.com/avatars/8667ba71-b85a-4004-af54-457a9734eed7?overlay`;

                const row = `
                    <div class="rank-row">
                        <div class="rank-number">${index + 1}.</div>
                        <div class="player-info">
                            <img src="${avatarUrl}" alt="${player.name}" class="player-avatar">
                            <div class="player-details">
                                <h3>${player.name}</h3>
                                <span>❖ ${title} (${totalPoints} points)</span>
                            </div>
                        </div>
                        <div class="region">${player.region.toUpperCase()}</div>
                        <div class="player-tiers">
                            ${tiersHTML}
                        </div>
                    </div>
                `;
                container.innerHTML += row;
            });
        }

        // Category Selection Click Logic
        const categoryElements = document.querySelectorAll('.category');
        categoryElements.forEach(category => {
            category.addEventListener('click', () => {
                categoryElements.forEach(c => c.classList.remove('active'));
                category.classList.add('active');
                
                currentMode = category.getAttribute('data-mode');
                renderLeaderboard();
            });
        });

        // Secret Admin Logic (Triple click)
        let clickCount = 0;
        let clickTimer;
        function handleLogoClick() {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            }
            if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                const password = prompt("Restricted Access. Enter Admin Password:");
                if (password === ADMIN_PASS) {
                    document.getElementById('admin-panel').style.display = 'block';
                    document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
                } else if (password !== null) {
                    alert("Authentication Failed.");
                }
            }
        }

        // Admin: Add/Update Player
        function addPlayer() {
            const name = document.getElementById('add-name').value.trim();
            const uuid = document.getElementById('add-uuid').value.trim();
            const region = document.getElementById('add-region').value;

            if (!name) return alert("Player name is required!");

            // Collect assigned tiers
            let tiersObj = {};
            GAMEMODES.forEach(gm => {
                let rank = document.getElementById(`tier-${gm}`).value;
                if (rank !== 'None') {
                    tiersObj[gm] = rank;
                }
            });

            // Remove if exists to update
            db = db.filter(p => p.name.toLowerCase() !== name.toLowerCase());

            // Push new record
            db.push({
                name: name,
                uuid: uuid,
                region: region,
                tiers: tiersObj
            });

            localStorage.setItem('apexTiersDB', JSON.stringify(db));
            alert(`Saved ${name}!`);
            
            document.getElementById('add-name').value = '';
            document.getElementById('add-uuid').value = '';
            renderLeaderboard();
        }

        // Admin: Remove Player
        function removePlayer() {
            const name = document.getElementById('remove-name').value.trim();
            if (!name) return alert("Enter a name to remove.");

            const initialLength = db.length;
            db = db.filter(p => p.name.toLowerCase() !== name.toLowerCase());

            if (db.length === initialLength) {
                alert(`Player ${name} not found.`);
            } else {
                localStorage.setItem('apexTiersDB', JSON.stringify(db));
                alert(`Removed ${name}.`);
                document.getElementById('remove-name').value = '';
                renderLeaderboard();
            }
        }

        // Initial Load
        renderLeaderboard();
    </script>
</body>
</html>
